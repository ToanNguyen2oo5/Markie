server:
  port: 8888

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: profile-service
          uri: http://localhost:8081
          predicates:
            - Path=/profile/**
        - id: post-service
          uri: http://localhost:8083
          predicates:
            - Path=/post/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/markie
          jwk-set-uri: http://localhost:8280/realms/markie/protocol/openid-connect/certs

idp:
  url: http://localhost:8280
