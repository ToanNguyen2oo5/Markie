server:
  port: 8083
  tomcat:
    # Drain rejected multipart bodies so the client receives the safe 413 response.
    max-swallow-size: -1
  servlet:
    context-path: /post
spring:
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B
  application:
    name: post-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27018/post-service?authSource=admin
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/markie

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  post-media:
    internal-secret: ${POST_MEDIA_INTERNAL_SECRET:}
    file-base-url: ${POST_MEDIA_FILE_BASE_URL:http://localhost:8084/file}
    public-base-url: ${POST_MEDIA_PUBLIC_BASE_URL:http://localhost:8888/file/post-media}
  moderation:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_MODERATION_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODERATION_MODEL:omni-moderation-latest}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  services:
    profile:
      url: http://localhost:8081/profile
