server:
  port: 8081
  servlet:
    context-path: /profile
spring:
  application:
    name: profile-service
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: 12345678
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/markie
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: profile-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  app:
    file-service:
      url: http://localhost:8084

idp:
  url: ${IDP_URL:http://localhost:8280}
  realm: ${IDP_REALM:markie}
  admin-client-id: ${IDP_ADMIN_CLIENT_ID:admin-cli}
  admin-username: ${IDP_ADMIN_USERNAME:admin}
  admin-password: ${IDP_ADMIN_PASSWORD:admin}
  default-role: ${IDP_DEFAULT_ROLE:USER}