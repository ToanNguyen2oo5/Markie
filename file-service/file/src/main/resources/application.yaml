server:
  port: 8084
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27018/file-service?authSource=admin
    redis:
      port: 6379
      host: localhost
  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/markie
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: file-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  servlet:
    multipart:
      max-file-size: 27MB
      max-request-size: 30MB
app:
  file:
    storage-dir: ${STORAGE_DIR:C:\uploads}
    download-prefix: ${DOWNLOAD_PREFIX:http://localhost:8888/file/media/download/}
    preview-prefix: ${PREVIEW_PREFIX:http://localhost:8888/file/media/preview/}