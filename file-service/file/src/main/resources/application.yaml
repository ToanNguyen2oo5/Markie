server:
  port: 8084
  tomcat:
    max-swallow-size: -1
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27018/file-service?authSource=admin
    redis:
      port: 6379
      host: localhost
  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/markie
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: file-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B
app:
  post-media:
    internal-secret: ${POST_MEDIA_INTERNAL_SECRET:}
    storage-dir: ${POST_MEDIA_STORAGE_DIR:C:/uploads-post-media}
    public-base-url: ${POST_MEDIA_PUBLIC_BASE_URL:http://localhost:8888/file/post-media}
  file:
    storage-dir: C:\uploads
    download-prefix: http://localhost:8888/file/media/download/
